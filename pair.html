<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScreenCapturer Phone Pairing</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 440px; width: 100%; border: 1px solid #334155; }
    h1 { margin-top: 0; font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
    #qrcode { display: inline-block; padding: 16px; background: white; border-radius: 12px; margin-bottom: 20px; }
    .url-box { background: #0f172a; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; word-break: break-all; color: #38bdf8; border: 1px solid #334155; margin-bottom: 16px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; font-size: 0.9rem; }
    .btn:hover { background: #2563eb; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>📱 Pair Your Phone</h1>
    <p>1. Make sure your phone is on the <strong>same Wi-Fi</strong>.<br>2. Scan this QR code with your phone's camera:</p>
    <div id="qrcode"></div>
    <div class="url-box" id="pairUrl">http://192.168.29.12:8765/#token=307ae34592516441a74a560442f40711502fe461b2cf9f7ac8f032ad08511c31</div>
    <a href="http://127.0.0.1:8765/#token=307ae34592516441a74a560442f40711502fe461b2cf9f7ac8f032ad08511c31" target="_blank" class="btn">Open Local Control Page</a>
  </div>
  <script>
    const url = "http://192.168.29.12:8765/#token=307ae34592516441a74a560442f40711502fe461b2cf9f7ac8f032ad08511c31";
    if (typeof QRCode !== 'undefined') {
      new QRCode(document.getElementById("qrcode"), { text: url, width: 220, height: 220 });
    } else {
      // Fallback using public QR API if CDN blocked
      const img = document.createElement("img");
      img.src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(url);
      document.getElementById("qrcode").appendChild(img);
    }
  </script>
</body>
</html>
