<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Screen Capturer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-group">
        <div class="status-dot" id="statusDot"></div>
        <h1>Screen Capturer</h1>
      </div>
      <div class="header-actions">
        <select id="formatSelect" class="format-select" aria-label="Image Format">
          <option value="png">PNG (Lossless)</option>
          <option value="jpeg" selected>JPEG (Fast, 90%)</option>
        </select>
      </div>
    </header>

    <main class="main-content">
      <!-- Error / Alert Banner -->
      <div id="errorBanner" class="alert-banner hidden">
        <span id="errorMessage"></span>
        <button id="dismissError" class="dismiss-btn">&times;</button>
      </div>

      <!-- Token Setup Modal/Banner if not paired -->
      <div id="tokenBanner" class="token-banner hidden">
        <p><strong>Pairing Required:</strong> Enter the token from the desktop tray or scan the QR code.</p>
        <div class="token-input-row">
          <input type="password" id="manualTokenInput" placeholder="Paste 64-char hex token" />
          <button id="saveTokenBtn" class="btn-sm">Save</button>
        </div>
      </div>

      <!-- Capture Controls -->
      <section class="controls-section">
        <button id="captureBtn" class="btn-capture">
          <span class="btn-spinner hidden" id="captureSpinner"></span>
          <span id="captureText">📸 Capture Screen</span>
        </button>
      </section>

      <!-- Preview Section -->
      <section id="previewSection" class="preview-section hidden">
        <div class="preview-header">
          <span id="captureMeta" class="capture-meta"></span>
          <div class="preview-actions">
            <button id="shareBtn" class="btn-action hidden">📤 Share</button>
            <a id="downloadLink" class="btn-action" download="screenshot.jpg">💾 Save</a>
          </div>
        </div>

        <div class="image-wrapper">
          <img id="previewImage" alt="Screen Capture Preview" />
        </div>
        <p class="preview-tip">💡 Tip: You can also tap &amp; hold / long-press the image to save or copy it.</p>
      </section>
    </main>

    <footer class="app-footer">
      <span id="timingInfo">Ready</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
