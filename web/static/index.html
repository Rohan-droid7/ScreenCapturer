<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ScreenCapturer</title>
  <link rel="stylesheet" href="style.css?v=1.2.0">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="status-indicator" id="statusDot"></div>
        <span class="brand-name">ScreenCapturer</span>
      </div>
      <div class="controls-right">
        <select id="formatSelect" class="select-format" aria-label="Format">
          <option value="jpeg" selected>JPEG (Fast)</option>
          <option value="png">PNG (Lossless)</option>
        </select>
        <button id="turnOffBtn" class="btn-power" title="Turn Off Server">Off</button>
      </div>
    </header>

    <main class="main-content">
      <!-- Error / Alert Banner -->
      <div id="errorBanner" class="alert-box hidden">
        <span id="errorMessage"></span>
        <button id="dismissError" class="btn-close">&times;</button>
      </div>

      <!-- Success / Notice Banner -->
      <div id="noticeBanner" class="notice-box hidden">
        <span id="noticeMessage"></span>
        <button id="dismissNotice" class="btn-close">&times;</button>
      </div>

      <!-- Token Pairing Input (only if opened without token) -->
      <div id="tokenBanner" class="token-box hidden">
        <input type="password" id="manualTokenInput" placeholder="Enter token" />
        <button id="saveTokenBtn" class="btn-primary">Connect</button>
      </div>

      <!-- Capture & Panic Lock Actions -->
      <div class="action-row">
        <button id="captureBtn" class="btn-capture">
          <span class="spinner hidden" id="captureSpinner"></span>
          <span id="captureText">📸 Capture Screen</span>
        </button>
        <button id="lockBtn" class="btn-lock" title="Panic Lock: Lock PC immediately (Win + L)">
          <span class="spinner hidden" id="lockSpinner"></span>
          <span id="lockText">🔒 Lock PC</span>
        </button>
      </div>

      <!-- 2-Way Clipboard Sync -->
      <section class="card clipboard-card">
        <div class="card-header">
          <span class="card-title">📋 Clipboard Sync</span>
          <span id="clipMeta" class="meta-tag">2-Way Sync</span>
        </div>
        <textarea id="clipInput" class="clip-textarea" rows="3" placeholder="Type or paste text to send to PC, or tap 'Get PC Clipboard'..."></textarea>
        <div class="clip-actions">
          <button id="getClipBtn" class="btn-secondary clip-btn" title="Fetch current text from PC clipboard">
            <span class="spinner hidden" id="getClipSpinner"></span>
            <span id="getClipText">📥 Get PC Clipboard</span>
          </button>
          <button id="sendClipBtn" class="btn-primary clip-btn" title="Send text from phone to PC clipboard">
            <span class="spinner hidden" id="sendClipSpinner"></span>
            <span id="sendClipText">📤 Send to PC</span>
          </button>
        </div>
        <div class="clip-sub-actions">
          <button id="copyPhoneBtn" class="btn-link hidden" title="Copy to phone clipboard">📋 Copy on Phone</button>
          <button id="clearClipBtn" class="btn-link" title="Clear text">Clear</button>
        </div>
      </section>

      <!-- Preview Card -->
      <div id="previewSection" class="preview-card hidden">
        <div class="preview-bar">
          <span id="captureMeta" class="meta-tag"></span>
          <div class="bar-actions">
            <button id="shareBtn" class="btn-secondary hidden">Share</button>
            <a id="downloadLink" class="btn-secondary" download="capture.jpg">Save</a>
          </div>
        </div>

        <div class="frame">
          <img id="previewImage" alt="Screen Capture" />
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <span id="timingInfo">Connected</span>
    </footer>
  </div>

  <script src="app.js?v=1.2.0"></script>
</body>
</html>
